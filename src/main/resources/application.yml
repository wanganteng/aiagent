spring:
  application:
    name: ai-agent
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://pgm-2zeoujn789tn63zf9o.rwlb.rds.aliyuncs.com/yu_ai_agent
    username: my_user
    password: Wat12345678
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen3:8b
    vectorstore:
      pgvector:
        index-type: HNSW
        dimensions: 1536 # 在不确定向量维度的情况下，不要指定dimensions配置，否则报错（数据库列的精度）
        distance-type: COSINE_DISTANCE
        max-document-batch-size: 10000 # Optional: Maximum number of documents per batch
    mcp:
      client:
        sse:
          #request-timeout: 600000可以设置，不设置也没事，新的包已经默认了大值
          connections:
            server1:
              url: http://localhost:8127
#        stdio:
